[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalguard-anomaly-detector"
version = "1.0.0"
description = "Reconstruction-error anomaly detection with Flask serving"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0,<4"]

[project.scripts]
signalguard = "anomaly_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
